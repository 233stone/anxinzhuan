[package]
name = "anxinzhuan"
version = "0.1.0"
edition = "2021"
description = "Offline speech-to-text CLI powered by SenseVoice-Small"
license = "MIT"
repository = "https://github.com/233stone/anxinzhuan"

[dependencies]
anyhow = "1"
dirs = "6"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
rubato = "0.15"
rustfft = "6"
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
ureq = "3"

[profile.release]
strip = true
